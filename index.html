<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator próby złota</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f4ec; color: #302b20; font: 16px system-ui, sans-serif; }
    main { width: 100%; max-width: 440px; padding: 32px; border-radius: 20px; background: white; box-shadow: 0 12px 40px #55401812; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { line-height: 1.5; color: #686153; }
    label { display: block; margin-top: 20px; font-weight: 600; }
    input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; font: inherit; }
    input { border: 1px solid #b8b1a2; }
    button { margin-top: 24px; border: 0; background: #88651b; color: white; cursor: pointer; font-weight: 700; }
    button:hover { background: #6c5015; }
    :focus-visible { outline: 3px solid #c9982d; outline-offset: 3px; }
    output { display: block; margin-top: 24px; line-height: 1.7; white-space: pre-line; }
    .note { font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Kalkulator próby złota</h1>
    <p>Oblicz próbę i karaty na podstawie znanej zawartości czystego złota w stopie.</p>
    <form id="calculator">
      <label for="total">Masa całego stopu (g)</label>
      <input id="total" type="text" inputmode="decimal" placeholder="np. 10" required>
      <label for="gold">Masa czystego złota (g)</label>
      <input id="gold" type="text" inputmode="decimal" placeholder="np. 5,85" required>
      <button type="submit">Oblicz próbę</button>
    </form>
    <output id="result" aria-live="polite"></output>
    <p class="note">Próba = masa czystego złota ÷ masa stopu × 1000. Wynik jest obliczeniem składu, a nie badaniem autentyczności wyrobu.</p>
  </main>
  <script>
    function calculatePurity(total, gold) {
      if (!Number.isFinite(total) || !Number.isFinite(gold) || total <= 0 || gold < 0 || gold > total) {
        throw new Error('Podaj masę stopu większą od zera oraz masę złota od 0 do masy stopu.');
      }
      return { purity: gold / total * 1000, karats: gold / total * 24, percent: gold / total * 100 };
    }
    function parseMass(value) {
      const normalized = value.trim().replace(',', '.');
      return /^(?:\d+(?:\.\d+)?|\.\d+)$/.test(normalized) ? Number(normalized) : NaN;
    }
    document.getElementById('calculator').addEventListener('submit', function (event) {
      event.preventDefault();
      const result = document.getElementById('result');
      try {
        const values = calculatePurity(parseMass(document.getElementById('total').value), parseMass(document.getElementById('gold').value));
        const format = (value, digits) => value.toLocaleString('pl-PL', { maximumFractionDigits: digits });
        result.textContent = `Próba: ${format(values.purity, 2)}‰\nKaraty: ${format(values.karats, 2)} K\nZawartość złota: ${format(values.percent, 2)}%`;
      } catch (error) {
        result.textContent = error.message;
      }
    });
  </script>
</body>
</html>
